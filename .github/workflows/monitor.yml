name: Chicago Regimentals 24h / 5min monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send the single clearly marked deployment test after a successful scan'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: chicago-regimentals-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify monitor logic
        run: python -m unittest discover -s tests -v
      - name: Scan the official deactivated category
        id: scan
        run: python watcher.py scan
      - name: Persist baseline and outbox before sending
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record catalogue state and notification outbox'
            git push
          fi
      - name: Notify confirmed new items
        run: python watcher.py notify
      - name: Send deployment test
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: python watcher.py --test-notification
      - name: Persist delivered notifications even after a partial send failure
        if: ${{ always() && steps.persist.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record delivered notifications'
            git push
          fi
